refresh_rate = "60 seconds"

[appenders.stdout]
kind = "console"
encoder.kind = "pattern"
encoder.pattern = "{d(%Y-%m-%d %H:%M:%S%.3f)(utc)} {h({l})} {M} {m}{n}"

[appenders.file]
kind = "rolling_file"
path = "logs/sideswap_dealer.txt"
encoder.kind = "pattern"
encoder.pattern = "{d(%Y-%m-%d %H:%M:%S%.3f)(utc)} {h({l})} {M} {m}{n}"

[appenders.file.policy]
kind = "compound"

[appenders.file.policy.trigger]
kind = "size"
limit = "100 mb"

[appenders.file.policy.roller]
kind = "fixed_window"
pattern = "logs/sideswap_dealer.{}.txt.gz"
base = 0
count = 10

# Third-party crates log from info, own crates from debug.
# (With a debug root every new dependency writes its debug output: h2 frames were 95% of the log.)
[root]
level = "info"
appenders = ["file"]
#appenders = ["file", "stdout"]

[loggers.sideswap_amp]
level = "debug"

[loggers.sideswap_api]
level = "debug"

[loggers.sideswap_common]
level = "debug"

[loggers.sideswap_dealer]
level = "debug"

[loggers.sideswap_dealer_amp]
level = "debug"

[loggers.sideswap_dealer_bitfinex]
level = "debug"

[loggers.sideswap_dealer_elements]
level = "debug"

[loggers.sideswap_dealer_lwk]
level = "debug"

[loggers.sideswap_lwk]
level = "debug"

[loggers.sideswap_manager]
level = "debug"

[loggers.sideswap_payjoin]
level = "debug"

[loggers.sideswap_types]
level = "debug"
